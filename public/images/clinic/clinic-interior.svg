<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#EDF2ED" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#clinicBg)" />

  <!-- Architectural clinic interior perspective lines -->
  <line x1="100" y1="100" x2="350" y2="350" stroke="#E9E2D9" stroke-width="2" />
  <line x1="1100" y1="100" x2="850" y2="350" stroke="#E9E2D9" stroke-width="2" />
  <rect x="350" y="250" width="500" height="400" rx="20" fill="#FFFFFF" stroke="#E9E2D9" stroke-width="2" />

  <!-- Consultation desk / lounge aesthetic elements -->
  <rect x="420" y="480" width="360" height="120" rx="16" fill="#EDF2ED" stroke="#C4A17B" stroke-width="1.5" />
  <circle cx="600" cy="380" r="48" fill="#253C34" fill-opacity="0.08" />
  <circle cx="600" cy="380" r="32" fill="#253C34" fill-opacity="0.15" />

  <!-- Lighting & Botanical touches -->
  <line x1="600" y1="0" x2="600" y2="200" stroke="#C4A17B" stroke-width="2" />
  <circle cx="600" cy="210" r="14" fill="#C4A17B" />

  <text x="600" y="550" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#253C34" letter-spacing="3">
    VIRTUE CLINICAL SUITE • AMBATTUR
  </text>
  <text x="600" y="575" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64796C" letter-spacing="1">
    PRIVATE CONSULTATION ROOMS
  </text>
</svg>

