<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="50%" stop-color="#EDF2ED" />
      <stop offset="100%" stop-color="#E9E2D9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4A17B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#253C34" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Architectural luxury arches & lighting -->
  <path d="M150 1000 C 150 350, 650 350, 650 1000 Z" fill="url(#accentGrad)" stroke="#E9E2D9" stroke-width="1.5" />
  <circle cx="400" cy="380" r="140" fill="#FFFFFF" fill-opacity="0.8" stroke="#C4A17B" stroke-width="1" />

  <!-- Minimalist clinical portrait silhouette -->
  <path d="M 330 460 C 330 330, 470 330, 470 460 C 470 510, 440 540, 400 550 C 360 540, 330 510, 330 460 Z" fill="#253C34" fill-opacity="0.12" />
  <path d="M 260 850 C 260 620, 540 620, 540 850 L 580 1000 L 220 1000 Z" fill="#253C34" fill-opacity="0.18" />

  <!-- Champagne botanical accents -->
  <path d="M 400 120 Q 420 200, 460 250" stroke="#C4A17B" stroke-width="1.5" fill="none" stroke-dasharray="4 4" />
  <circle cx="460" cy="250" r="4" fill="#C4A17B" />

  <!-- Label overlay -->
  <rect x="250" y="880" width="300" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.95" stroke="#E9E2D9" />
  <text x="400" y="910" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#253C34" letter-spacing="2">
    CLINICAL AESTHETIC SUITE
  </text>
</svg>

